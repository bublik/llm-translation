services:
  nllb-service:
    build: .
    container_name: nllb_ar_ru_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /app/storage/huggingface
      HF_HUB_CACHE: /app/storage/huggingface
      TRANSFORMERS_VERBOSITY: error
      TRANSFORMERS_OFFLINE: ${NLLB_TRANSFORMERS_OFFLINE:-0}
      NLLB_MODEL_CACHE_DIR: /app/storage/huggingface
      NLLB_CT2_MODEL_DIR: /app/storage/ct2-nllb-3.3b-int8
      NLLB_CT2_DEVICE: ${NLLB_CT2_DEVICE:-cpu}
      NLLB_CT2_INTER_THREADS: ${NLLB_CT2_INTER_THREADS:-1}
      NLLB_TRANSLATION_BACKEND: ${NLLB_TRANSLATION_BACKEND:-eurollm}
      NLLB_EUROLLM_MODEL_PATH: /app/storage/eurollm-1.7b-instruct-gguf/EuroLLM-1.7B-Instruct.Q4_K_M.gguf
      NLLB_EUROLLM_N_THREADS: ${NLLB_EUROLLM_N_THREADS:-8}
      NLLB_EUROLLM_N_CTX: ${NLLB_EUROLLM_N_CTX:-2048}
      NLLB_EUROLLM_MAX_TOKENS: ${NLLB_EUROLLM_MAX_TOKENS:-1536}
      NLLB_EUROLLM_REPEAT_PENALTY: ${NLLB_EUROLLM_REPEAT_PENALTY:-1.18}
      NLLB_RATE_LIMIT_ENABLED: ${NLLB_RATE_LIMIT_ENABLED:-true}
      NLLB_RATE_LIMIT_REQUESTS: ${NLLB_RATE_LIMIT_REQUESTS:-60}
      NLLB_RATE_LIMIT_WINDOW_SECONDS: ${NLLB_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ${STORAGE_PATH}:/app/storage
    security_opt:
      - seccomp:unconfined
    networks:
      - shared_net
    restart: unless-stopped

networks:
  shared_net:
    external: true
